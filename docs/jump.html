<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>油揚げジャンプゲーム(aburaage.jumpgame)</title>
    <link rel="stylesheet" href="jump.css">
</head>
<body>
    <canvas id="game"></canvas>
        <div class="ui">
          <h1>油揚げジャンプゲーム(aburaage.jumpgame)</h1>
          <div class="controls">
            <p><strong>操作</strong></p>
            <p>1p-a/2p-←:左へ移動</p>
            <p>1p-d/2p-→:右へ移動</p>
            <p>1p-w/2p-↑:ジャンプ</p>
            <p>1p-s/2p-↓:アイテム使用</p>
          </div>
        </div>
  <script src="jump.js"></script>
  
</body>
</html>
